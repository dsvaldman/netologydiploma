---
- name: grafana
  hosts: grafana
  tasks:

    - name: adding key for repo
      become: true
      action: shell wget -q -O - https://packages.grafana.com/gpg.key | sudo apt-key add -

    - name: adding repo
      become: true
      action: shell echo "deb https://packages.grafana.com/enterprise/deb stable main" | sudo tee -a /etc/apt/sources.list.d/grafana.list

    - name: updating repos 
      become: true
      action: shell apt-get update

    - name: installing grafana
      become: true
      apt:
        name: grafana
        state: present
      with_items:
        - grafana

    - name: enabling grafana
      become: true
      ansible.builtin.service:
        name: grafana-server.service
        enabled: yes

    - name: starting grafana
      become: true
      ansible.builtin.service:
        name: grafana-server.service
        state: started

    - name: Import Grafana dashboard
      community.grafana.grafana_dashboard:
        grafana_url: http://51.250.89.17:3000/
        grafana_api_key: "eyJrIjoiZ09lbmlyQktlYWxHd0xrTEZ5Q1pDM3gwZGFGTDBxaDMiLCJuIjoidGVzdCIsImlkIjoxfQ=="
        state: present
